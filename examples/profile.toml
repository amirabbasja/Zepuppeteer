# Copy to profiles/<account>/profile.toml; create src/ alongside it.
enabled = true
tags = ["reports", "team-a"]
# If src/ contains multiple browser profiles, select one explicitly:
# profile_directory = "Profile 1"

[settings]
timezone = "Asia/Tehran"

[settings.portal_a]
base_url = "https://example.com"

[settings.colab]
notebook_url = "https://colab.research.google.com/notebooks/intro.ipynb"

# Uncomment one VPN configuration to use: python -m zepuppeteer vpnCheck <account>
# Paths are relative to this profile.toml. WireGuard checks require Linux.
# [profile.vpn]
# vpn_protocol = "wireguard"
# wireguard_file = "tunnel.conf"
#
# [profile.vpn]
# vpn_protocol = "v2ray"
# v2ray_link = "vless://YOUR_ID@vpn.example.com:443?security=tls&type=ws&path=%2Fvpn"

# Uncomment to enable the Kaggle workflow for this profile:
# [profile.platforms.kaggle]
# login_username = "your-kaggle-username"
# notebook_url = "https://www.kaggle.com/code/your-kaggle-username/your-notebook/edit"
# notebook_name = "Your Notebook"

# Screen automation runs on a visible Linux X11 desktop. Configure screenshot
# crops for icon-only targets, using paths relative to this profile.toml.
# Regions are [left, top, width, height] fractions of the browser window.
# [settings.screen.targets.google_account]
# image = "icons/google-account.png"
# region = [0.7, 0.08, 0.3, 0.25]
# confidence = 0.9
#
# [settings.screen.targets.colab_connection_options]
# image = "icons/connection-options.png"
# region = [0.5, 0.08, 0.5, 0.3]
#
# [settings.screen.targets.colab_saved]
# text = "All changes saved"
# region = [0.0, 0.08, 1.0, 0.25]
#
# [settings.screen.targets.kaggle_account]
