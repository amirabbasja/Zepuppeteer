[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zepuppeteer"
version = "0.1.0"
description = "Profile groups and reusable web automation workflows with Brave and Playwright"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.2",
    "playwright>=1.58,<2",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
zepuppeteer = "zepuppeteer.cli:main"

[tool.setuptools.packages.find]
include = ["zepuppeteer*"]
